# Wasmer.io Deployment Configuration for Authentication Service
# This file configures the authentication microservice for deployment on Wasmer.io

# Service metadata
name: auth-service
version: 1.0.0
description: "Authentication microservice providing JWT, MFA, biometric, and social authentication"

# Runtime configuration
runtime: php
php_version: "8.2"

# Application entry point
main: index.php

# Environment variables
env:
  # Application settings
  APP_ENV: production
  APP_DEBUG: false
  SERVICE_VERSION: "1.0.0"
  SERVICE_NAME: "auth-service"
  TIMEZONE: "UTC"

  # Database configuration
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT:-3306}
  DB_NAME: ${DB_NAME}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_CHARSET: "utf8mb4"
  DB_COLLATION: "utf8mb4_unicode_ci"
  DB_POOL_SIZE: "20"
  DB_TIMEOUT: "30"

  # JWT configuration
  JWT_SECRET: ${JWT_SECRET}
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRY: "3600"
  JWT_REFRESH_EXPIRY: "86400"
  JWT_ISSUER: "auth-service"

  # Encryption
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}

  # Session management
  SESSION_LIFETIME: "3600"
  SESSION_CLEANUP_INTERVAL: "300"

  # Rate limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_MAX_ATTEMPTS: "10"
  RATE_LIMIT_WINDOW: "60"
  RATE_LIMIT_LOCKOUT_DURATION: "300"

  # Password policy
  PASSWORD_MIN_LENGTH: "8"
  PASSWORD_REQUIRE_UPPERCASE: "true"
  PASSWORD_REQUIRE_LOWERCASE: "true"
  PASSWORD_REQUIRE_NUMBERS: "true"
  PASSWORD_REQUIRE_SPECIAL: "true"
  PASSWORD_MAX_AGE_DAYS: "90"
  PASSWORD_HISTORY_COUNT: "5"

  # Multi-factor authentication
  MFA_CODE_EXPIRY: "300"
  MFA_BACKUP_CODES_COUNT: "5"
  TOTP_WINDOW: "1"
  TOTP_PERIOD: "30"

  # Magic link authentication
  MAGIC_LINK_ENABLED: "true"
  MAGIC_LINK_EXPIRY: "900"
  MAGIC_LINK_MAX_USES: "1"

  # Biometric authentication
  BIOMETRIC_ENABLED: "true"
  BIOMETRIC_TIMEOUT: "60"
  BIOMETRIC_MAX_DEVICES: "5"

  # Passkey (WebAuthn) authentication
  PASSKEY_ENABLED: "true"
  PASSKEY_TIMEOUT: "60"
  PASSKEY_MAX_DEVICES: "10"
  PASSKEY_USER_VERIFICATION: "preferred"

  # Social authentication
  SOCIAL_AUTH_ENABLED: "true"
  OAUTH_TIMEOUT: "30"

  # Google OAuth
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

  # Facebook OAuth
  FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
  FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}

  # GitHub OAuth
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

  # Apple OAuth
  APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
  APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
  APPLE_KEY_ID: ${APPLE_KEY_ID:-}
  APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}

  # Microsoft OAuth
  MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
  MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}

  # Twitter/X OAuth
  TWITTER_CLIENT_ID: ${TWITTER_CLIENT_ID:-}
  TWITTER_CLIENT_SECRET: ${TWITTER_CLIENT_SECRET:-}

  # Discord OAuth
  DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
  DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}

  # Amazon OAuth
  AMAZON_CLIENT_ID: ${AMAZON_CLIENT_ID:-}
  AMAZON_CLIENT_SECRET: ${AMAZON_CLIENT_SECRET:-}

  # External services
  EMAIL_SERVICE_ENABLED: ${EMAIL_SERVICE_ENABLED:-false}
  EMAIL_SERVICE_PROVIDER: ${EMAIL_SERVICE_PROVIDER:-}
  EMAIL_API_KEY: ${EMAIL_API_KEY:-}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}

  SMS_SERVICE_ENABLED: ${SMS_SERVICE_ENABLED:-false}
  SMS_SERVICE_PROVIDER: ${SMS_SERVICE_PROVIDER:-}
  SMS_API_KEY: ${SMS_API_KEY:-}
  SMS_FROM_NUMBER: ${SMS_FROM_NUMBER:-}

  # Firebase configuration
  FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
  FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
  FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
  FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}

  # Push notifications
  PUSH_NOTIFICATIONS_ENABLED: ${PUSH_NOTIFICATIONS_ENABLED:-false}

  # Offline authentication
  OFFLINE_AUTH_ENABLED: "true"
  OFFLINE_TOKEN_EXPIRY: "86400"
  OFFLINE_SYNC_INTERVAL: "300"

  # Logging configuration
  LOG_LEVEL: "INFO"
  LOG_FILE: "/tmp/auth-service.log"
  LOG_MAX_SIZE: "100MB"
  LOG_MAX_FILES: "5"

  # Audit logging
  AUDIT_LOG_ENABLED: "true"
  AUDIT_LOG_FILE: "/tmp/auth-audit.log"
  AUDIT_LOG_RETENTION_DAYS: "365"

  # Security monitoring
  SECURITY_MONITORING_ENABLED: "true"
  SECURITY_ALERT_THRESHOLD: "5"
  SECURITY_LOCKOUT_THRESHOLD: "10"

  # Performance settings
  MAX_CONCURRENT_REQUESTS: "100"
  REQUEST_TIMEOUT: "30"
  MEMORY_LIMIT: "256M"
  MAX_EXECUTION_TIME: "30"

  # Health checks
  HEALTH_CHECK_ENABLED: "true"
  HEALTH_CHECK_TIMEOUT: "5"
  HEALTH_CHECK_INTERVAL: "30"

  # Metrics and monitoring
  METRICS_ENABLED: "true"
  METRICS_RETENTION_DAYS: "30"
  PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-false}

  # CORS configuration
  CORS_ENABLED: "true"
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
  CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
  CORS_ALLOWED_HEADERS: "Content-Type,Authorization,X-Requested-With,X-API-Key"
  CORS_MAX_AGE: "86400"

  # SSL/TLS settings
  SSL_VERIFY_PEER: "true"
  SSL_VERIFY_HOST: "true"

# Resource limits
resources:
  memory: 512MB
  cpu: 0.5
  disk: 1GB

# Scaling configuration
scaling:
  min_instances: 1
  max_instances: 10
  target_cpu: 70
  target_memory: 80
  scale_up_cooldown: 300
  scale_down_cooldown: 600

# Health check configuration
health_check:
  path: "/health"
  port: 8080
  interval: 30
  timeout: 5
  healthy_threshold: 2
  unhealthy_threshold: 3
  initial_delay: 30

# Readiness probe
readiness_probe:
  path: "/health/ready"
  port: 8080
  interval: 10
  timeout: 3
  failure_threshold: 3
  initial_delay: 5

# Liveness probe
liveness_probe:
  path: "/health/live"
  port: 8080
  interval: 30
  timeout: 5
  failure_threshold: 3
  initial_delay: 60

# Network configuration
network:
  port: 8080
  protocol: http
  
# Load balancer configuration
load_balancer:
  algorithm: round_robin
  health_check: true
  sticky_sessions: false
  timeout: 30

# Logging configuration
logging:
  level: INFO
  format: json
  outputs:
    - console
    - file

# Monitoring and observability
monitoring:
  metrics: true
  tracing: false
  profiling: false

# Security settings
security:
  https_only: true
  hsts: true
  content_security_policy: true
  x_frame_options: "DENY"
  x_content_type_options: "nosniff"
  referrer_policy: "strict-origin-when-cross-origin"

# File system permissions
filesystem:
  read_only: false
  tmp_size: 100MB
  
# Caching configuration
cache:
  enabled: true
  type: memory
  size: 64MB
  ttl: 3600

# Database connection pooling
database:
  pool_size: 20
  max_connections: 50
  connection_timeout: 30
  idle_timeout: 300

# Build configuration
build:
  commands:
    - "composer install --no-dev --optimize-autoloader"
    - "php migrate.php"
  
# Deployment hooks
hooks:
  pre_deploy:
    - "php -v"
    - "composer validate"
  
  post_deploy:
    - "php health-check.php"
    - "curl -f http://localhost:8080/health || exit 1"

# Environment-specific overrides
environments:
  development:
    env:
      APP_ENV: development
      APP_DEBUG: true
      LOG_LEVEL: DEBUG
    resources:
      memory: 256MB
      cpu: 0.25
    scaling:
      min_instances: 1
      max_instances: 2

  staging:
    env:
      APP_ENV: staging
      APP_DEBUG: false
      LOG_LEVEL: INFO
    resources:
      memory: 512MB
      cpu: 0.5
    scaling:
      min_instances: 1
      max_instances: 5

  production:
    env:
      APP_ENV: production
      APP_DEBUG: false
      LOG_LEVEL: WARNING
    resources:
      memory: 1GB
      cpu: 1.0
    scaling:
      min_instances: 2
      max_instances: 20
    security:
      https_only: true
      hsts: true

# Backup configuration
backup:
  enabled: false
  schedule: "0 2 * * *"
  retention: 30

# Maintenance mode
maintenance:
  enabled: false
  message: "Authentication service is temporarily unavailable for maintenance"
  allowed_ips: []