name: Deploy All Microservices in Parallel to Wasmer

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Wasmer
        uses: wasmerio/setup-wasmer@v3.1

      - name: Install PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl
          tools: composer

      - name: Deploy all microservices in parallel
        shell: bash
        run: |
          set -e
          echo "🔍 Discovering microservices..."

          root_dir=$(pwd)

          pids=()
          services=()

          for dir in */; do
            clean_dir="${dir%/}"
            wasmer_toml="${clean_dir}/wasmer.toml"

            if [[ -f "$wasmer_toml" ]]; then
              echo "🚀 Starting deploy for $clean_dir..."

              (
                if [[ -f "${root_dir}/${clean_dir}/app/composer.json" ]]; then
                  echo "📦 Installing PHP dependencies in ${clean_dir}/app..."
                  cd "${root_dir}/${clean_dir}/app" || { echo "❌ [${clean_dir}] app folder missing"; exit 1; }
                  composer install --prefer-dist
                  composer dump-autoload --optimize
                fi

                cd "${root_dir}/${clean_dir}" || { echo "❌ [${clean_dir}] folder missing"; exit 1; }
                echo "⚙️ Running wasmer deploy in $clean_dir..."
                wasmer deploy --token=${{ secrets.WASMER_TOKEN }} --non-interactive --no-wait --no-persist-id
              ) &

              pids+=($!)
              services+=("$clean_dir")
            fi
          done

          exit_code=0
          for i in "${!pids[@]}"; do
            pid="${pids[$i]}"
            svc="${services[$i]}"
            if wait "$pid"; then
              echo "✅ [$svc] deployed successfully."
            else
              echo "❌ [$svc] deployment failed."
              exit_code=1
            fi
          done

          exit $exit_code
